[project]
name = "document-builder-ai"
version = "0.1.0"
description = "AI-assisted Word/Excel/PDF document builder for Windows"
requires-python = ">=3.11,<3.13"
dependencies = [
    "jsonschema>=4.21",
    "keyring>=25.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "reportlab>=4.1",
    "pypdf>=4.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
